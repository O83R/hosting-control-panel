<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول · لوحة الاستضافة</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <div class="eyebrow">HOSTING CONTROL PANEL</div>
      <h1>تسجيل الدخول</h1>
      <p>الوصول الإداري إلى لوحة إدارة استضافة VPS.</p>
      <form id="loginForm">
        <label>اسم المستخدم<input id="username" autocomplete="username" value="admin" required></label>
        <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">دخول</button>
        <div id="loginError" class="login-error hidden"></div>
      </form>
      <small>v0.8 · Authentication Foundation · SSH Tunnel only</small>
    </section>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
